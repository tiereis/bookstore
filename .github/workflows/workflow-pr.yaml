name: Python Pull Request Workflow
on: [pull_request]

jobs:
  qa:
    name: Quality check
    runs-on: ubuntu-latest  # Atualizado de ubuntu-18.04 para ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # Atualizado de v1 para v4
      
      - name: Set up Python
        uses: actions/setup-python@v5 # Atualizado de @master para @v5
        with:
          python-version: 3.13

      - name: Install poetry
        run: |
          pip install -U pip
          pip install poetry
          # A linha 'poetry install' já está no passo 'Install dependencies', então ela não é necessária aqui

      - name: View poetry --help
        run: poetry --help

      - name: Install dependencies
        shell: bash
        run: python -m poetry install
      
      - name: Test
        run: |
          poetry run python manage.py test
      
      - name: Wemake Python Stylguide
        uses: wemake-services/wemake-python-styleguide@0.16.0
        continue-on-error: true
        with:
          reporter: 'github-pr-review'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}